name: CI

on: [workflow_dispatch]

permissions: "read-all"

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check packages
        run: |
          python -m pip install pip "setuptools<68" "wheel==0.38.4" twine rstcheck;
          python setup.py sdist bdist_wheel;
          rstcheck README.rst CHANGES.rst
          python -m twine check dist/*
        env:
          PIP_INDEX_URL: https://:2023-03-11@time-machines-pypi.sealsecurity.io/
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
  test:
    # Upstream's own interpreter list, restored on current runner labels
    # (upstream used macos-11 / ubuntu-20.04, both retired). Every leg below is
    # verified green; exclusions are per-leg and evidence-based, see
    # process/README.md for what is not tested and why.
    strategy:
      fail-fast: false
      matrix:
        # Quoted so 3.10 is not parsed as the float 3.1.
        python-version: ["2.7", "3.6", "3.7", "3.8", "3.9", "3.10"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - {python-version: "2.7", os: macos-latest}
          - {python-version: "2.7", os: windows-latest}
          - {python-version: "3.6", os: ubuntu-latest}
          - {python-version: "3.7", os: ubuntu-latest}
          - {python-version: "3.6", os: macos-latest}
          - {python-version: "3.7", os: macos-latest}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    name: ${{ matrix.os }} ${{ matrix.python-version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # MatteoH2O1999/setup-python, not actions/setup-python: the stock action
      # cannot provision EOL interpreters on current runners (nor 3.9 on arm64
      # macOS). This drop-in builds from source when no prebuilt exists, so
      # upstream's own matrix can run. Same action the sibling seal
      # 1.26.20+sp2 uses.
      - name: Set Up Python - ${{ matrix.python-version }}
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache-build: true
          allow-build: allow

      - name: Set Up Python 3 to run nox
        if: matrix.python-version == '2.7'
        uses: actions/setup-python@v5
        with:
          python-version: "3"

      # lazy-object-proxy 1.7.0 claims Requires-Python ">=2.7,..." but its setup.py
      # uses a bare `super()`; upstream re-tagged the next release as ">=3.6" the same
      # day. It arrives only via gcp-devrel-py-tools -> astroid<2.0, an app_engine-only
      # dev-requirement. Scoped to this leg via GITHUB_ENV so py3 legs are untouched.
      - if: matrix.python-version == '2.7'
        name: Constrain py2-incompatible transitive deps
        run: |
          echo "lazy-object-proxy<1.7" > "$RUNNER_TEMP/py27-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/py27-constraints.txt" >> "$GITHUB_ENV"

      # virtualenv >= 20.22 dropped Python 2.7; upstream pinned it for the same reason.
      - if: matrix.python-version == '2.7'
        name: Install Dependencies (py2.7 leg)
        env:
          PIP_INDEX_URL: https://:2023-03-11@time-machines-pypi.sealsecurity.io/
        run: python -m pip install --upgrade pip setuptools nox 'virtualenv<20.22.0'

      - if: matrix.python-version != '2.7'
        name: Install Dependencies
        env:
          # Resolve nox and its dependency graph at this package's release date.
          # Unconstrained, nox pulls `argcomplete<4`, and argcomplete 3.7.1
          # annotates `Final[Mapping[str, str | bytes]]` in a class body -- a PEP
          # 604 union that raises TypeError on Python <= 3.9, so nox fails to
          # import before any test runs.
          PIP_INDEX_URL: https://:2023-03-11@time-machines-pypi.sealsecurity.io/
        run: python -m pip install --upgrade pip setuptools nox

      - name: Run Tests
        run: ./ci/run_tests.sh
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          NOX_SESSION: ${{ matrix.nox-session }}
          PIP_INDEX_URL: https://:2023-03-11@time-machines-pypi.sealsecurity.io/
